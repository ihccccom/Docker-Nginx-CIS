# =======================================================
# Nginx Docker Compose - 拉取预构建镜像部署
# 适用于直接使用 GitHub Actions 预构建的镜像
# 符合 CIS Docker Benchmark 安全基准
# =======================================================
#
# 使用方法:
#   1. 按需修改下方 image 地址
#   2. 启动: docker compose up -d
#   3. 停止: docker compose down
#   4. 日志: docker compose logs -f nginx
#
# 首次使用（私有镜像）:
#   cat ~/dockerhub_token.txt | docker login -u <username> --password-stdin
#
# 注意:
#   - 绑定挂载 ./conf 时，若缺少 OWASP CRS rules/plugins，
#     entrypoint 会从镜像种子自动补齐
#   - HTTP/3 需要同时映射 TCP/UDP 443
#

services:
  nginx:
    # 格式: <Docker Hub用户名>/nginx:latest
    image: ihccccom/nginx:latest
    container_name: nginx

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./conf:/opt/nginx/conf
      - ./conf.d:/opt/nginx/conf.d
      - ./ssl:/opt/nginx/ssl
      - ./logs:/opt/nginx/logs
      - ./wwwroot:/www/wwwroot

    security_opt:
      - no-new-privileges:true
      # - seccomp=./security/seccomp/nginx-seccomp.json
      # - apparmor=docker-nginx

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"
          pids: 200
        reservations:
          memory: 256M
          cpus: "0.5"

    restart: unless-stopped

    stop_grace_period: 30s
    stop_signal: SIGQUIT

    ulimits:
      nofile:
        soft: 65535
        hard: 65535


    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=8m
      - /var/cache/nginx:rw,noexec,nosuid,size=512m

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "nginx"

    shm_size: "256m"
    hostname: nginx
    networks:
      - nginx-network

networks:
  nginx-network:
    name: nginx-network
    driver: bridge
