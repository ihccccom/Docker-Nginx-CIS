# =======================================================
# Nginx 主配置文件
# 符合 CIS Nginx Benchmark v2.0.1 / PCI DSS v4.0 安全基准
# 路径占位符 %NGINX_DIR% 在 Docker 构建时会被自动替换
# =======================================================

user www-data www-data;
worker_processes  auto;
error_log  %NGINX_DIR%/logs/nginx_error.log  warn;
pid        %NGINX_DIR%/logs/nginx.pid;

# [BROTLI_LOAD_START]
load_module %NGINX_DIR%/modules/ngx_http_brotli_filter_module.so;
load_module %NGINX_DIR%/modules/ngx_http_brotli_static_module.so;
# [BROTLI_LOAD_END]
# [HEADERS_MORE_LOAD_START]
load_module %NGINX_DIR%/modules/ngx_http_headers_more_filter_module.so;
# [HEADERS_MORE_LOAD_END]
# [MODSECURITY_LOAD_START]
load_module %NGINX_DIR%/modules/ngx_http_modsecurity_module.so;
# [MODSECURITY_LOAD_END]
# [FANCYINDEX_LOAD_START]
load_module %NGINX_DIR%/modules/ngx_http_fancyindex_module.so;
# [FANCYINDEX_LOAD_END]

worker_rlimit_nofile 65535;
# 企业滚动发布：给 worker 足够时间排空连接
worker_shutdown_timeout 30s;

events {
    use epoll;
    worker_connections  51200;
    multi_accept on;
}


http {
    include       mime.types;
    include       proxy.conf;
    include       real-ip.conf;
    include       resolvers.conf;

    default_type  application/octet-stream;

    client_body_temp_path /var/cache/nginx/client_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # CIS Nginx 2.5.1
    server_name_in_redirect off;
    port_in_redirect off;
    absolute_redirect off;

    # CIS Nginx - 禁止目录列表
    autoindex off;

    server_names_hash_bucket_size 512;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 16k;
    client_max_body_size 50m;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    reset_timedout_connection on;

    # 超时（CIS 2.4.3 / 2.4.4）
    keepalive_timeout  65 65;
    client_body_timeout   15;
    client_header_timeout 15;
    send_timeout          15;
    keepalive_requests    1000;

    charset utf-8;

    # 高并发下减少反复 open()
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # FastCGI（PHP 等后端）
    fastcgi_connect_timeout    300;
    fastcgi_send_timeout       300;
    fastcgi_read_timeout       300;
    fastcgi_buffer_size        64k;
    fastcgi_buffers            4 64k;
    fastcgi_busy_buffers_size  128k;
    fastcgi_temp_file_write_size 256k;
    fastcgi_intercept_errors   on;

    # [BROTLI_START]
    brotli on;
    brotli_comp_level 6;
    brotli_buffers 16 8k;
    brotli_min_length 256;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    brotli_static always;
    # [BROTLI_END]

    gzip on;
    gzip_min_length  256;
    gzip_buffers     4 16k;
    gzip_http_version 1.1;
    gzip_comp_level  5;
    gzip_types text/plain application/javascript text/javascript text/css application/xml application/json image/svg+xml application/xml+rss font/ttf font/otf font/woff font/woff2;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "MSIE [1-6]\.";

    # 限流 / 连接限制
    limit_req_zone  $binary_remote_addr zone=req_limit:20m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:20m;
    limit_conn_zone $server_name zone=perserver:20m;
    limit_req_status  429;
    limit_conn_status 429;

    # CIS 5.1.2 - 隐藏版本；headers-more 进一步清理 Server 头
    server_tokens off;
    # [HEADERS_MORE_START]
    # 清除 Server 响应头；错误页标识仍可由构建期 NGINX_FAKE_NAME 控制
    more_clear_headers Server;
    # [HEADERS_MORE_END]

    # 文本日志（运维 tail）+ JSON 日志（SIEM / 集中采集）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
      '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"host":"$host",'
        '"scheme":"$scheme"'
      '}';

    access_log %NGINX_DIR%/logs/nginx_access.log main;
    access_log %NGINX_DIR%/logs/nginx_access.json json_combined;

    # TLS（CIS 4.1 / PCI DSS 4.1）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve X25519:secp384r1:secp256r1;
    ssl_dhparam %NGINX_DIR%/ssl/dhparam.pem;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # [MODSECURITY_START]
    modsecurity on;
    modsecurity_rules_file %NGINX_DIR%/conf/modsecurity/main.conf;
    # [MODSECURITY_END]

    # CIS 2.4.2 - 默认拦截未配置域名
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        # 仅本机健康检查（Docker HEALTHCHECK 走 127.0.0.1）
        location = /nginx-health {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location / {
            limit_req zone=req_limit burst=20 nodelay;
            limit_conn perip 20;
            limit_conn perserver 200;
            return 444;
        }
    }

    server {
        listen       443 ssl default_server;
        listen       [::]:443 ssl default_server;
        http2        on;
        server_name  _;

        ssl_certificate     %NGINX_DIR%/ssl/default/default.pem;
        ssl_certificate_key %NGINX_DIR%/ssl/default/default.key;
        ssl_stapling off;

        limit_req zone=req_limit burst=20 nodelay;
        limit_conn perip 20;
        limit_conn perserver 200;

        # 限制方法（避免 if）
        location / {
            limit_except GET HEAD POST {
                deny all;
            }
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "0" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            return 444;
        }
    }

    include %NGINX_DIR%/conf.d/sites-enabled/*.conf;
}
