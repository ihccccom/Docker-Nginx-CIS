# =======================================================
# PHP 8.4 FastCGI 配置
# 在 server {} 块中使用:
#   include /opt/nginx/conf/php/enable-php-84.conf;
# 或（路径已替换占位符后）:
#   include %NGINX_DIR%/conf/php/enable-php-84.conf;
#
# 需要 PHP-FPM 通过 Docker 网络可达（默认 php:36000）
# Unix Socket 模式示例: fastcgi_pass unix:/run/php/php8.4-fpm.sock;
# =======================================================

location ~ [^/]\.php(/|$) {
    try_files $uri =404;
    fastcgi_pass php:36000;
    fastcgi_index index.php;
    include fastcgi.conf;
    include php/pathinfo.conf;
}
