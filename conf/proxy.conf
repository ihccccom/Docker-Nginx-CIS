# =======================================================
# Nginx 反向代理和缓存配置
# 路径占位符 %NGINX_DIR% 在 Docker 构建时会被自动替换
# =======================================================

# 缓存临时文件目录
proxy_temp_path /var/cache/nginx/proxy_temp;

# 缓存存储设置
proxy_cache_path /var/cache/nginx/proxy_cache levels=1:2 keys_zone=cache_one:100m inactive=1d max_size=5g;

# 启用缓存区域
# 注释掉全局默认
# proxy_cache cache_one;

# 客户端请求体缓冲区
client_body_buffer_size 512k;

# 超时设置（连接/读取/发送）
proxy_connect_timeout 60s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;

# 缓冲区设置（响应缓存）
proxy_buffer_size 32k;
proxy_buffers 4 64k;
proxy_busy_buffers_size 128k;
proxy_temp_file_write_size 128k;

# 缓存有效期（按状态码）
proxy_cache_valid 200 302 10m;
proxy_cache_valid 301 1h;
proxy_cache_valid 404 1m;

# 源站异常时使用旧缓存
proxy_cache_use_stale error timeout invalid_header http_500 http_502 http_503 http_504 updating;

# 故障切换条件
proxy_next_upstream error timeout invalid_header http_500 http_503 http_404;

# 防止缓存 POST 等动态请求
proxy_cache_methods GET HEAD;

# ============================================================
# 反向代理安全头部（传递客户端真实信息到后端）
# ============================================================
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# 禁用后端响应中可能泄露信息的头部
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-Runtime;
