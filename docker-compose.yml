# =======================================================
# Nginx Docker Compose - 本地构建（Local Build）
# 适用于：在本地从源码编译构建 Nginx Docker 镜像
# 符合 CIS Docker Benchmark 安全基准
# =======================================================
#
# 使用方法:
#   docker compose up -d          # 构建并启动
#   docker compose down            # 停止
#   docker compose logs -f nginx   # 查看日志
#   docker compose restart nginx   # 重启
#
# 仅构建镜像:
#   docker compose build
#   docker compose build --build-arg USE_modsecurity=false
#   docker compose build --build-arg NGINX_FAKE_NAME="MyServer"
#
# 如需使用预构建镜像，请使用:
#   docker compose -f docker-compose.hub.yml up -d
#
# 注意:
#   - 绑定挂载 ./conf 时，若缺少 OWASP CRS rules/plugins，
#     entrypoint 会从镜像种子自动补齐到 conf/modsecurity/
#   - HTTP/3 需要同时映射 TCP/UDP 443
#

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      # 构建参数（取消注释以自定义）
      # args:
      #   USE_modsecurity: "true"
      #   USE_owasp: "true"
      #   NGINX_VERSION: "1.30.5"
      #   OPENSSL_VERSION: "3.5.8"
      #   NGINX_FAKE_NAME: "SecureWeb"
    image: nginx:latest
    container_name: nginx

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./conf:/opt/nginx/conf
      - ./conf.d:/opt/nginx/conf.d
      - ./ssl:/opt/nginx/ssl
      - ./logs:/opt/nginx/logs
      - ./wwwroot:/www/wwwroot

    # ============================================================
    # CIS Docker Benchmark 安全配置
    # ============================================================
    security_opt:
      - no-new-privileges:true
      # 可选：自定义 Seccomp（相对本文件路径）
      # - seccomp=./security/seccomp/nginx-seccomp.json
      # 可选：AppArmor（需先在宿主机加载 profile docker-nginx）
      # - apparmor=docker-nginx

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"
          pids: 200
        reservations:
          memory: 256M
          cpus: "0.5"

    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=8m
      - /var/cache/nginx:rw,noexec,nosuid,size=512m

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "nginx"

    shm_size: "256m"
    hostname: nginx
    networks:
      - nginx-network

networks:
  nginx-network:
    name: nginx-network
    driver: bridge
