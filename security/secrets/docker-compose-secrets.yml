# =======================================================
# Nginx Docker Compose Secrets 配置示例
# 演示如何使用 Docker Secrets 管理敏感信息
# =======================================================
#
# 使用方法:
#   1. 准备密钥文件:
#      mkdir -p ./secrets
#      cp /path/to/fullchain.pem ./secrets/ssl_cert.pem
#      cp /path/to/privkey.pem ./secrets/ssl_key.pem
#      cp /path/to/ca.pem ./secrets/ssl_ca.pem
#      htpasswd -c ./secrets/htpasswd admin
#
#   2. 启动服务:
#      docker compose -f security/secrets/docker-compose-secrets.yml up -d
#
#   3. 验证 Secrets 已挂载:
#      docker exec nginx ls -la /run/secrets/
#
# 说明:
#   - OWASP CRS 规则位于镜像内 /opt/nginx/conf/modsecurity/rules，无需单独 owasp 卷
#   - 证书路径与站点模板 ssl/<domain>/ 布局对齐（示例使用 example.com）
#

services:
  nginx:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: nginx:latest
    container_name: nginx

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    secrets:
      - source: ssl_cert
        target: /opt/nginx/ssl/example.com/fullchain.pem
        uid: "0"
        gid: "0"
        mode: 0444
      - source: ssl_key
        target: /opt/nginx/ssl/example.com/privkey.pem
        uid: "0"
        gid: "0"
        mode: 0400
      - source: ssl_ca
        target: /opt/nginx/ssl/example.com/ca.pem
        uid: "0"
        gid: "0"
        mode: 0444
      - source: nginx_htpasswd
        target: /opt/nginx/conf/htpasswd
        uid: "0"
        gid: "0"
        mode: 0400

    volumes:
      - nginx-conf:/opt/nginx/conf
      - nginx-confd:/opt/nginx/conf.d
      - nginx-logs:/opt/nginx/logs
      - wwwroot:/www/wwwroot

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"
          pids: 200
        reservations:
          memory: 256M
          cpus: "0.5"

    restart: unless-stopped

    stop_grace_period: 30s
    stop_signal: SIGQUIT

    ulimits:
      nofile:
        soft: 65535
        hard: 65535


    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=8m
      - /var/cache/nginx:rw,noexec,nosuid,size=512m

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "nginx"

    shm_size: "256m"
    hostname: nginx
    networks:
      - nginx-network

secrets:
  ssl_cert:
    file: ./secrets/ssl_cert.pem
  ssl_key:
    file: ./secrets/ssl_key.pem
  ssl_ca:
    file: ./secrets/ssl_ca.pem
  nginx_htpasswd:
    file: ./secrets/htpasswd

volumes:
  nginx-conf:
    name: nginx-conf
  nginx-confd:
    name: nginx-confd
  nginx-logs:
    name: nginx-logs
  wwwroot:
    name: wwwroot

networks:
  nginx-network:
    name: nginx-network
    driver: bridge
