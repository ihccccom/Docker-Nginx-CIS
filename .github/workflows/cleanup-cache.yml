# =======================================================
# GitHub Actions 工作流：清理 Actions 缓存
# 手动触发，删除仓库中所有 GitHub Actions 缓存
# =======================================================

name: Cleanup Actions Cache

on:
  workflow_dispatch:

jobs:
  cleanup:
    name: Delete all Actions caches
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Cleanup all caches
        uses: actions/github-script@v9
        with:
          script: |
            let deleted = 0;
            let page = 1;

            while (true) {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page: page,
              });

              if (caches.data.actions_caches.length === 0) {
                break;
              }

              for (const cache of caches.data.actions_caches) {
                console.log(`Deleting cache: ${cache.key} (${cache.id})`);
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                deleted++;
              }

              page++;
            }

            console.log(deleted > 0 ? `Deleted ${deleted} cache(s).` : 'No caches found.');
